name: Build, stress and browser E2E

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build and test ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            sdk: '8.0.x'
          - framework: net9.0
            sdk: '9.0.x'
          - framework: net10.0
            sdk: '10.0.x'
          - framework: net11.0
            sdk: '11.0.x'
    env:
      TARGET_FRAMEWORK: ${{ matrix.framework }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Select matching SDK
        shell: bash
        run: |
          major="${TARGET_FRAMEWORK#net}"
          sdk_version=$(dotnet --list-sdks | awk -v prefix="$major." 'index($1, prefix) == 1 && $1 !~ /-/ { print $1 }' | sort -V | tail -1)
          test -n "$sdk_version"
          printf '{"sdk":{"version":"%s","rollForward":"disable"}}\n' "$sdk_version" > global.json
          dotnet --info

      - name: Restore
        run: dotnet restore RazorBlazorDataExchange.sln -p:TargetFrameworks=$TARGET_FRAMEWORK

      - name: Build
        run: dotnet build RazorBlazorDataExchange.sln -c Release --no-restore -p:TargetFrameworks=$TARGET_FRAMEWORK

      - name: Run broker stress tests
        run: dotnet run --project RazorBlazorDataExchange.StressTests/RazorBlazorDataExchange.StressTests.csproj -c Release --framework $TARGET_FRAMEWORK --no-build

      - name: Run v0.6 ordering and transport tests
        run: dotnet run --project RazorBlazorDataExchange.V06Tests/RazorBlazorDataExchange.V06Tests.csproj -c Release --framework $TARGET_FRAMEWORK --no-build

      - name: Install Playwright Chromium
        run: pwsh RazorBlazorDataExchange.E2ETests/bin/Release/$TARGET_FRAMEWORK/playwright.ps1 install --with-deps chromium

      - name: Start Razor/Blazor tester
        shell: bash
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5087 \
          ASPNETCORE_ENVIRONMENT=Development \
          dotnet run \
            --project RazorBlazorDataExchangeTester/RazorBlazorDataExchangeTester.csproj \
            -c Release \
            --framework "$TARGET_FRAMEWORK" \
            --no-build \
            --no-launch-profile \
            > tester.log 2>&1 &
          echo $! > tester.pid

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5087/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Tester did not become ready."
          cat tester.log
          exit 1

      - name: Run Razor-Blazor browser E2E tests
        env:
          RBDX_BASE_URL: http://127.0.0.1:5087
        run: dotnet run --project RazorBlazorDataExchange.E2ETests/RazorBlazorDataExchange.E2ETests.csproj -c Release --framework $TARGET_FRAMEWORK --no-build

      - name: Show tester log
        if: always()
        run: cat tester.log || true

      - name: Stop Razor/Blazor tester
        if: always()
        shell: bash
        run: |
          if [ -f tester.pid ]; then
            kill "$(cat tester.pid)" || true
          fi
